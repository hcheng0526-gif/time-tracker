name: Build Windows EXE
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller PySide6
    - name: Ensure __init__.py Exists
      run: |
        if (!(Test-Path "database\__init__.py")) { New-Item -ItemType File -Path "database\__init__.py" }
        if (!(Test-Path "components\__init__.py")) { New-Item -ItemType File -Path "components\__init__.py" }
        if (!(Test-Path "widgets\__init__.py")) { New-Item -ItemType File -Path "widgets\__init__.py" }
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --paths=. `
        --collect-all database `
        --collect-all components `
        --collect-all widgets `
        --hidden-import config `
        --hidden-import utils `
        main.py
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FocusTracker-EXE
        path: dist/main.exe
